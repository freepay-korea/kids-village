name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 러너에는 Android SDK가 이미 들어 있다 (ANDROID_HOME). 부족한 플랫폼·빌드툴은 Gradle이 받는다.

      - run: npm ci

      # 앱용 빌드(base=/) + Capacitor 동기화 (android/app/src/main/assets/public 생성)
      - run: npm run build:app

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kids-village-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kids-village-debug-apk
          path: kids-village-debug.apk

      # 폰에서 바로 받을 수 있게 Releases 탭의 "apk-latest" 프리릴리즈에 항상 최신 APK를 올린다
      - name: Publish to apk-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 테스트용 APK (최신 main)
          prerelease: true
          body: |
            main 브랜치 최신 빌드의 디버그 APK예요. 폰에서 내려받아 설치하면 돼요 ("출처를 알 수 없는 앱" 허용 필요).
            Play 스토어용 서명된 AAB는 docs/앱빌드.md를 따라 Android Studio에서 만들어요.
          files: kids-village-debug.apk
